<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">فضای آزمایشگاهی ترنج</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" rx="24" fill="url(#bg)"/>

  <!-- horizon line -->
  <rect x="0" y="560" width="960" height="160" fill="#F8FAFC"/>

  <!-- bench -->
  <rect x="80" y="520" width="800" height="24" rx="8" fill="#CBD5E1"/>
  <rect x="110" y="544" width="20" height="120" fill="#CBD5E1"/>
  <rect x="830" y="544" width="20" height="120" fill="#CBD5E1"/>

  <!-- microscope -->
  <g transform="translate(430,300)">
    <rect x="-10" y="180" width="140" height="16" rx="6" fill="#0EA5E9"/>
    <rect x="50" y="40" width="18" height="150" rx="8" fill="#0369A1"/>
    <circle cx="59" cy="30" r="26" fill="#0EA5E9"/>
    <rect x="30" y="60" width="120" height="18" rx="9" fill="#0369A1"/>
    <rect x="42" y="70" width="18" height="70" rx="6" fill="#7DD3FC" transform="rotate(20 51 105)"/>
  </g>

  <!-- test tubes rack -->
  <g transform="translate(650,360)">
    <rect x="-20" y="120" width="200" height="14" rx="6" fill="#94A3B8"/>
    <g fill="#7DD3FC" stroke="#0369A1" stroke-width="2">
      <rect x="0" y="20" width="22" height="110" rx="11"/>
      <rect x="40" y="10" width="22" height="120" rx="11"/>
      <rect x="80" y="30" width="22" height="100" rx="11"/>
      <rect x="120" y="0" width="22" height="130" rx="11"/>
    </g>
    <g fill="#0EA5E9">
      <rect x="2" y="70" width="18" height="60" rx="9"/>
      <rect x="42" y="55" width="18" height="75" rx="9"/>
      <rect x="82" y="80" width="18" height="50" rx="9"/>
      <rect x="122" y="45" width="18" height="85" rx="9"/>
    </g>
  </g>

  <!-- petri dish -->
  <g transform="translate(200,420)">
    <ellipse cx="60" cy="60" rx="60" ry="60" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="4"/>
    <circle cx="40" cy="50" r="6" fill="#7DD3FC"/>
    <circle cx="70" cy="70" r="8" fill="#7DD3FC"/>
    <circle cx="80" cy="40" r="5" fill="#7DD3FC"/>
  </g>
</svg>
